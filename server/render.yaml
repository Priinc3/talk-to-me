services:
  - type: web
    name: talk-to-me-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: GCP_PROJECT_ID
        value: project-271c2912-087b-4e51-aa3
      - key: GCP_LOCATION
        value: us-central1
      - key: VERTEX_SA_JSON
        sync: false
